name: release-binaries

# Builds eden-cli for the Steam Deck (SteamOS 3.8: glibc 2.39, the same as Ubuntu 24.04) as a
# self-contained AppImage plus a plain tar.gz, and publishes them as a GitHub release when a
# deck-* tag is pushed. Manual runs build the current branch and publish a pre-release unless
# "Publish" is unticked. The Qt frontend is not built: the Deck runs eden-cli (docs/SteamDeck.md).

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
  push:
    tags:
      - "deck-*"

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux-x86_64 eden-cli
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # No libfmt-dev or nlohmann-json3-dev: CMake would pick Ubuntu's fmt 9 over the bundled
      # fmt 12 and the build fails in common/logging.h (tools/steamdeck/README.md).
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev libzstd-dev liblz4-dev libssl-dev ccache
          cmake --version

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x86_64-${{ github.sha }}
          restore-keys: |
            ccache-linux-x86_64-

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DENABLE_QT=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DENABLE_WEB_SERVICE=OFF
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DUSE_CCACHE=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build/release --target yuzu-cmd --parallel
          ccache --show-stats
          test -x build/release/bin/eden-cli
          strip build/release/bin/eden-cli

      - name: Name the build
        id: name
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # GitHub artifacts drop the executable bit; a tar keeps it. Uses the system's libraries
      # (ffmpeg, boost, opus...) at the versions SteamOS 3.8 ships.
      - name: Package tar.gz
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "eglantine-steamdeck-${{ steps.name.outputs.version }}-linux-x86_64.tar.gz" \
            -C build/release/bin eden-cli
          ls -la eglantine-steamdeck-*.tar.gz

      # linuxdeploy bundles every library eden-cli needs except the base system ones (glibc,
      # X11/Wayland client libraries, the GPU driver and Vulkan loader). Runs on glibc 2.39+.
      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$tools"/*.AppImage
          icon="$RUNNER_TEMP/dev.eglantine.eden-cli.png"
          cp dist/Eglantine.png "$icon"
          cat > "$RUNNER_TEMP/dev.eglantine.eden-cli.desktop" <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Eglantine (Steam Deck)
          GenericName=Switch 2 Emulator
          Comment=Eglantine's eden-cli built for the Steam Deck
          Icon=dev.eglantine.eden-cli
          Exec=eden-cli %f
          Terminal=true
          Categories=Game;Emulator;
          Keywords=Nintendo;Switch;
          EOF
          export APPIMAGE_EXTRACT_AND_RUN=1
          export LDAI_OUTPUT="eglantine-steamdeck-${{ steps.name.outputs.version }}-linux-x86_64.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH=x86_64
          "$tools/linuxdeploy-x86_64.AppImage" --appdir AppDir \
            --executable build/release/bin/eden-cli \
            --desktop-file "$RUNNER_TEMP/dev.eglantine.eden-cli.desktop" \
            --icon-file "$icon" \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"
          # eglantine test 3 (this branch): the diagnostic build ships under
          # its friendly name, which the test3 launcher looks up explicitly.
          cp "$LDAI_OUTPUT" "eglantine test 3.AppImage"
          ls -la "eglantine test 3.AppImage"

      # The launcher script and the settings file the fork is measured with (docs/user/
      # SteamDeckAppImage.md); unversioned so the guide's download instructions stay the same.
      - name: Package the Steam Deck kit
        shell: bash
        run: |
          set -euo pipefail
          # eglantine test 3 (this branch): the diagnostic launcher plus a
          # verbatim copy of the working settings as its separate ini.
          cp dist/steamdeck/eglantine-deck.ini dist/steamdeck/eglantine-test3.ini
          tar -czf eglantine-steamdeck-kit.tar.gz -C dist/steamdeck             eglantine-deck.sh eglantine-deck.ini             eglantine-test3.sh eglantine-test3.ini README-test3.txt
          tar -tzf eglantine-steamdeck-kit.tar.gz

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-steamdeck-${{ steps.name.outputs.version }}
          path: |
            eglantine-steamdeck-*.tar.gz
            eglantine-steamdeck-*.AppImage
            eglantine-steamdeck-kit.tar.gz
            eglantine test 3.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: eglantine-steamdeck-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
            flags=()
            title="Eglantine for Steam Deck ${GITHUB_REF_NAME}"
          else
            tag="build-${GITHUB_RUN_NUMBER}"
            flags=(--prerelease)
            title="Eglantine for Steam Deck ${GITHUB_REF_NAME} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          fi
          notes="eden-cli built from ${GITHUB_SHA} for the Steam Deck (SteamOS 3.8). The state of the fork, what runs and how fast, is in [docs/SteamDeck.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/SteamDeck.md). Step-by-step setup, including a Steam shortcut for Game Mode: [docs/user/SteamDeckAppImage.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/user/SteamDeckAppImage.md).

          **AppImage**: \`chmod +x\` it and run it from a terminal or a Steam shortcut; it bundles its libraries and needs glibc 2.39 or newer (SteamOS 3.8, Ubuntu 24.04, Fedora 40, Arch). Launch a loose dump with \`EDEN_NX2_AUTO_STUB=1 ./eglantine-steamdeck-*.AppImage -f -c eglantine-deck.ini -g <title>/exefs/main\`.

          **eglantine-steamdeck-kit.tar.gz**: \`eglantine-deck.sh\` (launcher: settings, environment, per-game switches, Steam shortcut target) and \`eglantine-deck.ini\` (the settings the fork is measured with). Unpack next to the AppImage; the guide above explains both.

          **tar.gz**: \`eden-cli\` alone, linked against the system's ffmpeg, boost and opus at Ubuntu 24.04's versions.

          Qt frontend, Windows, macOS and Android are not built by this fork; use upstream Eglantine for those."
          gh release create "$tag" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            "${flags[@]}" \
            --title "$title" \
            --notes "$notes"
